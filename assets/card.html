<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=860, initial-scale=1">
<style>
  :root{
    --bg:#ffffff;
    --panel:#f7f9fc;
    --panel-2:#eef2f7;
    --line:#e2e8f0;
    --ink:#0f172a;
    --ink-2:#1e293b;
    --muted:#475569;
    --faint:#64748b;
    --accent:#1d4ed8;
    --accent-2:#1e3a8a;
    --accent-soft:#dbeafe;
    --win:#15803d;
    --lose:#b91c1c;
    --gold:#1e3a8a;
    --analysis-bg:#f7f9fc;
    --analysis-line:#1d4ed8;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg)}
  body{
    color:var(--ink);
    font-family:"MiSans","Noto Sans CJK SC","Source Han Sans SC","Microsoft YaHei",
                "PingFang SC","Hiragino Sans GB","WenQuanYi Micro Hei",sans-serif;
    font-size:17px;
    line-height:1.65;
    -webkit-font-smoothing:antialiased;
  }
  .card{
    width:860px;
    padding:26px 32px 32px;
    background:var(--panel);
    border:1px solid var(--line);
    border-top:3px solid var(--accent);
  }
  #content{width:838px}
  #content>*:first-child{margin-top:0}
  #content>*:last-child{margin-bottom:0}

  /* 分栏目标题统一深蓝色，正文/详情保持黑色 */
  #content h1{
    margin:0 0 14px;
    padding-bottom:10px;
    font-size:28px;
    line-height:1.35;
    font-weight:700;
    color:var(--accent);
    border-bottom:2px solid var(--panel-2);
    letter-spacing:.01em;
  }
  #content h2{
    margin:22px 0 10px;
    font-size:20px;
    font-weight:600;
    color:var(--accent);
    border-left:4px solid var(--accent);
    padding-left:10px;
  }
  /* 玩家标题行：英雄头像 / 等级 / 玩家ID / KDA。
     整行统一 24px（正文 17px 的约 1.4 倍）—— 比原先的 36px 收窄，
     既不喧宾夺主，也保证长昵称不容易折行。整行同号是有意的：
     曾试过「等级小号 + 昵称/KDA 大号」的行内混排，字号不齐会让基线看起来飘。 */
  #content h3{
    margin:18px 0 8px;
    font-size:24px;
    line-height:1.3;
    font-weight:600;
    color:var(--accent);
  }
  #content h4,#content h5,#content h6{
    margin:14px 0 6px;
    font-size:17px;
    font-weight:600;
    color:var(--muted);
  }
  #content p{margin:9px 0;color:var(--ink)}
  #content strong{color:var(--accent);font-weight:700}
  #content em{color:var(--accent-soft);font-style:normal;font-weight:600}

  #content table{
    width:100%;
    border-collapse:collapse;
    margin:13px 0 8px;
    font-size:16px;
    table-layout:auto;
  }
  #content th{
    background:var(--panel-2);
    color:var(--accent);
    font-weight:600;
    text-align:left;
    padding:9px 12px;
    border:1px solid var(--line);
    white-space:nowrap;
  }
  #content td{
    padding:8px 12px;
    border:1px solid var(--line);
    color:var(--ink);
    vertical-align:top;
  }
  #content tbody tr:nth-child(even) td{background:#fafbfc}

  #content ul,#content ol{margin:9px 0;padding-left:26px}
  #content li{margin:5px 0;color:var(--ink)}
  #content li::marker{color:var(--accent)}

  #content code{
    background:#f3f4f6;
    padding:2px 6px;
    border-radius:4px;
    font-size:15px;
    color:var(--accent-soft);
    font-family:"JetBrains Mono","DejaVu Sans Mono",monospace;
  }
  #content pre{
    background:#f7f8fa;
    border:1px solid var(--line);
    border-radius:6px;
    padding:12px 14px;
    overflow:hidden;
    white-space:pre-wrap;
    word-break:break-word;
  }
  #content pre code{background:none;padding:0}
  #content blockquote{
    margin:10px 0;
    padding:6px 14px;
    border-left:3px solid var(--accent);
    background:#f2f7ff;
    color:var(--ink);
  }
  #content hr{
    border:0;
    border-top:1px solid var(--line);
    margin:18px 0;
  }

  /* 玩家区块：左侧英雄立绘竖跨三行，右侧依次是标题行、数据行、装备行。
     布局脚本会把每个 ### 玩家段落及其后两行包进 .player-block，
     并把立绘从 h3 里提出来作为独立的第一列（见文件末尾 groupPlayerBlocks）。
     用 grid 而不是 float：float 的高度取决于内容，行数一变就会串到下一名玩家；
     grid 用 grid-row:1/span 3 把立绘**精确**钉在三行上，标题折行也不受影响。 */
  #content .player-block{
    display:grid;
    grid-template-columns:auto minmax(0,1fr);
    column-gap:12px;
    row-gap:2px;
    align-items:start;
    margin:16px 0;
  }
  #content .player-block h3{margin:0}
  #content .player-block p{margin:0}
  #content .player-block p:has(img){margin-top:4px}
  /* 立绘：占据左列，竖跨三行。235x272 的竖版立绘按 132px 高计算约 114px 宽，
     右侧仍有约 714px 放数据，标题在 24px 下能容纳更长的昵称。 */
  #content .player-block img.hero-portrait{
    grid-column:1;
    grid-row:1 / span 3;
    height:132px;
    width:auto;
    margin:0;
    align-self:start;
    background:var(--panel-2);
    border:1px solid var(--line);
    border-radius:6px;
  }

  /* 装备图标：Valve 官方 CDN 的游戏内装备图（88x64 透明底 PNG）。
     图标加载失败时浏览器会显示 alt 文本（中文物品名），因此这里给 img
     设定与 alt 文本相称的尺寸和边框，退化后依然是一块可读的排版。 */
  #content img{
    height:34px;
    width:auto;
    margin:0 3px 0 0;
    vertical-align:middle;
    background:var(--panel-2);
    border:1px solid var(--line);
    border-radius:4px;
    object-fit:contain;
  }
  /* 同一行的装备图标不要在行内被拆散 */
  #content p:has(img){line-height:1.9}
  /* 玩家区块内的装备图标略小：立绘 132px 高，34px 的图标已接近其 1/4，
     再大就会把装备行挤成两行，破坏与立绘的三行对齐。 */
  #content .player-block p img{height:30px}
  /* 立绘缺失时（浏览器拿不到图）退回英雄名文本，别留一个空框 */
  #content .player-block img.hero-portrait[data-broken]{
    display:none;
  }
  #content a{color:var(--accent);text-decoration:none}

  /* 综合分析：固定放在卡片最下方，与上方数据表格用分隔线隔开，绝不重叠 */
  #content>.analysis-heading{
    margin-top:26px;
    padding:10px 14px;
    color:var(--accent);
    background:var(--analysis-bg);
    border-left:4px solid var(--accent);
    border-top:1px solid var(--analysis-line);
    border-right:1px solid var(--analysis-line);
    border-bottom:1px solid var(--analysis-line);
    border-radius:0 8px 0 0;
  }
  /* 总结正文放大到分栏目标题尺寸（20px）。原先继承 body 的 17px，
     用户反馈偏小；放大后可读性更好，图片相应变长是可以接受的代价。 */
  #content>.analysis-body{
    color:var(--ink);
    background:var(--analysis-bg);
    border-left:4px solid var(--accent);
    border-right:1px solid var(--analysis-line);
    margin:0;
    padding:9px 14px;
    font-size:20px;
    line-height:1.72;
  }
  /* 综合分析里的英雄名加粗、但不放大。
     曾把英雄名同时加粗并放大一号（1.1em），同一段里字号忽大忽小，连读时
     反而不好读；现在只保留加粗（深蓝 + 700），字号与正文一致，
     既不丢重点，也不会让行距看起来参差。 */
  #content>.analysis-body strong{
    color:var(--accent);
    font-weight:700;
    font-size:inherit;
  }
  /* 综合分析内的三个小栏目（天辉方的表现 / 夜魇方的表现 / 一句话总结）。

     它们渲染成 h3，语义上却是总结的次级标题，因此不能沿用 #content h3 的
     24px：那会让小标题比它统领的正文（20px）还大。这里压到 19px，
     与正文拉开层级但不喧宾夺主。

     注意这三个 h3 同样带 .analysis-body —— 见卡片末尾的 markAnalysisBlock，
     它给 h2 之后的所有兄弟节点都加上该类。这样整块底纹才是连续的一条；
     代价是要把该类的段落装饰（上下 padding、左右边框）在这里改掉，
     否则小标题自己会多出一圈内边距、把底纹切成不连续的两段。
     间距用 padding-top 而不是 margin-top：margin 会在底纹里露出白底。 */
  #content>h3.analysis-body{
    font-size:19px;
    font-weight:700;
    line-height:1.5;
    color:var(--accent);
    margin:0;
    padding:15px 14px 3px;
  }
  /* 紧跟在「综合分析」标题后的第一个小栏目，上间距由标题块自己提供 */
  #content>.analysis-heading+h3.analysis-body{
    padding-top:6px;
  }

  /* ── 战报卡新结构（横幅 / 分队条 / 玩家核心行 / 两行指标条）── */

  /* 顶部横幅：MVP 信息在左，立绘在右，比分压在立绘上 */
  #content .match-banner{
    position:relative;
    height:190px;
    border-radius:14px;
    background:var(--panel);
    overflow:hidden;
    margin:18px 0 24px;
    display:grid;
    grid-template-columns:1fr 338px;
  }
  #content .match-banner .banner-art{
    grid-column:2;
    grid-row:1;
    height:100%;
    width:100%;
    background-size:cover;
    background-position:25% 0;
    opacity:0.92;
  }
  #content .match-banner .banner-art::before{
    content:"";
    position:absolute;
    inset:0;
    background:linear-gradient(to right, var(--panel) 0%, rgba(255,255,255,0) 55%);
  }
  #content .match-banner .banner-info{
    grid-column:1 / span 2;
    grid-row:1;
    position:relative;
    z-index:1;
    padding:14px 22px 18px;
    display:flex;
    flex-direction:column;
    justify-content:flex-end;
    align-items:flex-start;
  }
  #content .match-banner .banner-meta{
    position:absolute;
    top:14px;
    left:22px;
    font-size:11px;
    color:var(--faint);
  }
  #content .match-banner .banner-eyebrow{
    font-size:13px;
    font-weight:700;
    color:var(--accent);
    letter-spacing:0.12em;
  }
  #content .match-banner .banner-name{
    font-size:34px;
    font-weight:700;
    color:var(--gold);
    line-height:1.1;
    margin:2px 0 4px;
  }
  #content .match-banner .banner-hero{
    font-size:14px;
    color:var(--muted);
  }
  #content .match-banner .banner-kda{
    font-size:22px;
    font-weight:700;
    margin-top:4px;
  }
  #content .match-banner .banner-kda .k{color:var(--win)}
  #content .match-banner .banner-kda .d{color:var(--lose)}
  #content .match-banner .banner-kda .a{color:var(--accent)}
  #content .match-banner .banner-score{
    position:absolute;
    right:18px;
    bottom:20px;
    background:rgba(255,255,255,0.96);
    border-radius:10px;
    padding:6px 14px;
    display:flex;
    align-items:baseline;
    gap:8px;
    font-size:14px;
    color:var(--muted);
    z-index:2;
  }
  #content .match-banner .banner-score .score-num{
    font-size:34px;
    font-weight:700;
    line-height:1;
  }
  #content .match-banner .banner-score .score-num.win{color:var(--win)}
  #content .match-banner .banner-score .score-num.lose{color:var(--muted)}
  #content .match-banner .banner-score .sep{font-size:22px;margin:0 2px}

  /* 分队条 */
  #content .team-band{
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:var(--panel-2);
    border-radius:8px;
    padding:9px 14px;
    margin:16px 0 10px;
    border-left:4px solid var(--line);
  }
  #content .team-band.team-win{border-left-color:var(--win)}
  #content .team-band.team-lose{border-left-color:var(--lose)}
  #content .team-band .team-name{font-size:16px;font-weight:600;color:var(--ink)}
  #content .team-band .team-result{font-size:12px;margin-left:8px;font-weight:600}
  #content .team-band .team-meta{font-size:12px;color:var(--muted)}

  /* 玩家核心行：昵称在左，GPM/XPM 靠右 */
  #content .player-block h3{
    margin:0;
    display:flex;
    align-items:baseline;
    gap:8px;
    flex-wrap:wrap;
  }
  #content .player-block h3 .level{font-size:12px;color:var(--muted)}
  #content .player-block h3 .kda{font-weight:700}
  #content .player-block h3 .kda .k{color:var(--win)}
  #content .player-block h3 .kda .d{color:var(--lose)}
  #content .player-block h3 .kda .a{color:var(--accent)}
  #content .player-block h3 .core-metrics{
    margin-left:auto;
    display:inline-flex;
    gap:16px;
    font-size:19px;
    color:var(--ink-2);
    font-weight:500;
  }

  /* 指标条：上行数值 / 下行标签（8 列：GPM/XPM/金钱/补刀/伤害/参战/推塔/治疗），每列居中 */
  #content .metric-strip{
    display:grid;
    grid-template-columns:repeat(8, 1fr);
    gap:4px;
    margin:8px 0;
  }
  #content .metric-strip .metric{display:flex;flex-direction:column;align-items:center;text-align:center}
  #content .metric-strip .metric-value{font-size:21px;font-weight:500;color:var(--ink);line-height:1.1}
  #content .metric-strip .metric-label{font-size:11px;color:var(--muted);margin-top:2px}

  #content>.analysis-body:last-child{
    border-bottom:1px solid var(--analysis-line);
    border-radius:0 0 8px 0;
    padding-bottom:12px;
  }
</style>
</head>
<body>
  <div class="card">
    <article id="content"></article>
  </div>
  <textarea id="markdown-source" hidden>{{ text | safe }}</textarea>

  </script>
  <script>
    (function () {
      var src = document.getElementById("markdown-source").value || "";
      var el = document.getElementById("content");

      // 战报卡：把 ``## MVP ...`` 横幅与比分行组装成 .match-banner。
      // 网络 t2i 当前 504 超时，但保留此路径以便服务恢复后样式一致。
      function buildMatchBanner(root) {
        var h2s = Array.prototype.slice.call(root.querySelectorAll("h2"));
        var bannerH2 = null;
        for (var i = 0; i < h2s.length; i++) {
          if ((h2s[i].textContent || "").trim().startsWith("MVP ")) {
            bannerH2 = h2s[i];
            break;
          }
        }
        if (!bannerH2) return;
        var scoreP = bannerH2.nextElementSibling;
        if (!scoreP || scoreP.tagName !== "P") return;

        var img = bannerH2.querySelector("img");
        var heroName = img ? (img.alt || "") : "";
        var artUrl = img ? img.src : "";

        // 玩家名 = 第一个非空文本节点；KDA = 匹配 x/y/z 的文本。
        // 模板里没有用 <strong>，因此不能按 strong 解析。
        var rawText = (bannerH2.textContent || "").replace(/^MVP\s*/, "").trim();
        var parts = rawText.split("·");
        var name = "";
        var kda = "";
        parts.forEach(function (part) {
          var t = part.trim();
          if (!t) return;
          if (/^\d+\/\d+\/\d+$/.test(t)) kda = t;
          else if (!name) name = t;
        });

        var scoreText = scoreP.textContent || "";
        var scoreMatch = scoreText.match(/(天辉)\s+(\d+)\s*:\s*(\d+)\s+(夜魇)/);
        if (!scoreMatch || !kda) return;

        var radiantScore = parseInt(scoreMatch[2], 10);
        var direScore = parseInt(scoreMatch[3], 10);
        var leftWin = radiantScore > direScore;
        var meta = scoreText.split("·").slice(1).join(" · ").trim();

        var wrap = document.createElement("div");
        wrap.className = "match-banner";
        var art = document.createElement("div");
        art.className = "banner-art";
        if (artUrl) art.style.backgroundImage = "url(" + artUrl + ")";
        var info = document.createElement("div");
        info.className = "banner-info";
        info.innerHTML = '<div class="banner-meta">' + escapeHtml(meta) + '</div>' +
          '<div class="banner-eyebrow">MVP</div>' +
          '<div class="banner-name">' + escapeHtml(name || "匿名玩家") + '</div>' +
          '<div class="banner-hero">' + escapeHtml(heroName) + '</div>' +
          '<div class="banner-kda"><span class="k">' + escapeHtml(kda.split("/")[0] || "") + '</span>/<span class="d">' + escapeHtml(kda.split("/")[1] || "") + '</span>/<span class="a">' + escapeHtml(kda.split("/")[2] || "") + '</span></div>';
        var score = document.createElement("div");
        score.className = "banner-score";
        score.innerHTML = '<span>' + escapeHtml(scoreMatch[1]) + '</span>' +
          '<span class="score-num ' + (leftWin ? "win" : "lose") + '">' + escapeHtml(scoreMatch[2]) + '</span>' +
          '<span class="sep">:</span>' +
          '<span class="score-num ' + (leftWin ? "lose" : "win") + '">' + escapeHtml(scoreMatch[3]) + '</span>' +
          '<span>' + escapeHtml(scoreMatch[4]) + '</span>';
        info.appendChild(score);
        wrap.appendChild(art);
        wrap.appendChild(info);
        bannerH2.parentNode.insertBefore(wrap, bannerH2);
        bannerH2.parentNode.removeChild(bannerH2);
        scoreP.parentNode.removeChild(scoreP);
      }

      function styleTeamBands(root) {
        root.querySelectorAll("h2").forEach(function (h2) {
          if (h2.classList.contains("analysis-heading")) return;
          if ((h2.textContent || "").trim().startsWith("MVP ")) return;
          h2.classList.add("team-band");
          var txt = h2.textContent || "";
          if (txt.indexOf("获胜") !== -1) h2.classList.add("team-win");
          else h2.classList.add("team-lose");
        });
      }

      function restructurePlayerBlocks(root) {
        root.querySelectorAll(".player-block").forEach(function (block) {
          var h3 = block.querySelector("h3");
          if (!h3 || h3.dataset.restructured) return;
          var html = h3.innerHTML;
          var gpm = "", xpm = "";
          html = html.replace(/GPM (\d+)/g, function (_, n) { gpm = n; return ""; });
          html = html.replace(/XPM (\d+)/g, function (_, n) { xpm = n; return ""; });
          html = html.replace(/\s*·\s*$/, "").replace(/\s*·\s*·\s*/g, " · ");
          if (gpm || xpm) {
            var core = document.createElement("span");
            core.className = "core-metrics";
            core.innerHTML = (gpm ? "GPM " + escapeHtml(gpm) : "") +
              (gpm && xpm ? " · " : "") + (xpm ? "XPM " + escapeHtml(xpm) : "");
            h3.innerHTML = html;
            h3.appendChild(core);
          }
          h3.querySelectorAll("strong").forEach(function (st) {
            var t = st.textContent || "";
            if (/^\d+\/\d+\/\d+$/.test(t)) {
              var parts = t.split("/");
              st.innerHTML = '<span class="k">' + escapeHtml(parts[0]) + '</span>/<span class="d">' + escapeHtml(parts[1]) + '</span>/<span class="a">' + escapeHtml(parts[2]) + '</span>';
            }
          });
          block.querySelectorAll("p").forEach(function (p) {
            var txt = p.textContent || "";
            // 指标条现在以 GPM/XPM 开头，含「金钱」即认为是指标行（8 项）
            if (txt.indexOf("｜") === -1 || txt.indexOf("金钱") === -1) return;
            var strip = document.createElement("div");
            strip.className = "metric-strip";
            txt.split("｜").forEach(function (seg) {
              var m = seg.trim().match(/^(\S+)\s+(.+)$/);
              if (!m) return;
              var cell = document.createElement("div");
              cell.className = "metric";
              cell.innerHTML = '<span class="metric-value">' + escapeHtml(m[2]) + '</span><span class="metric-label">' + escapeHtml(m[1]) + '</span>';
              strip.appendChild(cell);
            });
            p.parentNode.replaceChild(strip, p);
          });
          h3.dataset.restructured = "1";
        });
      }

      function escapeHtml(s) {
        return (s || "").replace(/[&<>"]/g, function (c) {
          return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
        });
      }
      function paintResultMarks(root) {
        var walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null);
        var nodes = [];
        while (walker.nextNode()) nodes.push(walker.currentNode);
        nodes.forEach(function (node) {
          var t = node.nodeValue || "";
          if (t.indexOf("\u2705") === -1 && t.indexOf("\u274c") === -1) return;
          var frag = document.createDocumentFragment();
          for (var i = 0; i < t.length; i++) {
            var ch = t.charAt(i);
            if (ch === "\u2705" || ch === "\u274c") {
              var span = document.createElement("span");
              span.textContent = ch;
              span.style.color = ch === "\u2705" ? "#1a7f37" : "#cf222e";
              span.style.fontWeight = "700";
              frag.appendChild(span);
            } else {
              frag.appendChild(document.createTextNode(ch));
            }
          }
          node.parentNode.replaceChild(frag, node);
        });
      }

      // 玩家区块：把每个 ### 玩家段落及其后两行（数据行、装备行）包进
      // .player-block，并把英雄立绘从 h3 里提出来当独立的第一列，
      // 由 CSS 的 grid-row:1/span 3 让它竖跨三行 —— 这就是需求里
      // 「英雄头像占据左侧、跨越三行，右侧才是其它数据」的实现。
      //
      // 为什么放在渲染后而不是模板里：Markdown 由 core/templates.py 统一生成，
      // 而 t2i 端点只吃纯 Markdown（tmpldata.text）；在这里改造 DOM，
      // 本地 Pillow 路径与网络路径共用同一份 Markdown，两边都不会跑偏。
      function groupPlayerBlocks(root) {
        var heads = Array.prototype.slice.call(root.querySelectorAll("h3"));
        heads.forEach(function (head) {
          if (head.dataset && head.dataset.playerGrouped) return;

          // 只处理「玩家标题」：必须带英雄立绘。
          // 拿不到立绘（缓存缺失/图片加载失败）时不分组，
          // 版式退回普通段落，标题里的英雄名照常显示。
          var img = head.querySelector("img");
          if (!img) return;

          // 先把跟随的行收集起来，**再**移动 head ——
          // 一旦 head 被移进区块，head.nextElementSibling 就变成 null 了，
          // 那时再去遍历会一行都收不到（数据行、装备行会留在区块外面）。
          var followers = [];
          var node = head.nextElementSibling;
          var guard = 0;
          while (node && guard < 4) {
            if (/^H[1-6]$/.test(node.tagName) || node.tagName === "TABLE") break;
            if (node.tagName === "P" && (node.textContent || "").trim() === "") break;
            followers.push(node);
            node = node.nextElementSibling;
            guard++;
          }

          var block = document.createElement("div");
          block.className = "player-block";
          head.parentNode.insertBefore(block, head);

          // 立绘提出来作为第一列（grid 第一格），由 CSS 让它竖跨三行
          img.classList.add("hero-portrait");
          block.appendChild(img);
          // 立绘后面原本跟着一个「 · 」分隔符，图片被摘走后它会悬在行首，
          // 变成「· Lv.19 · miracle · 10/2/5」。这里连同左侧空白一起去掉。
          var first = head.firstChild;
          if (first && first.nodeType === 3) {
            first.nodeValue = (first.nodeValue || "")
              .replace(/^\s*·\s*/, "");
          }
          block.appendChild(head);
          followers.forEach(function (row) { block.appendChild(row); });

          if (head.dataset) head.dataset.playerGrouped = "1";
        });
      }

      // 立绘缺失时不要留一个空框：直接隐藏，让标题行里的英雄名照常显示
      function guardBrokenPortraits(root) {
        Array.prototype.slice.call(root.querySelectorAll("img.hero-portrait"))
          .forEach(function (img) {
            img.addEventListener("error", function () {
              img.setAttribute("data-broken", "1");
            });
            if (img.complete && img.naturalWidth === 0) {
              img.setAttribute("data-broken", "1");
            }
          });
      }

      // 标记「综合分析」区块，让它作为卡片最后一个区块单独着色
      function markAnalysisBlock(root) {
        var headings = root.querySelectorAll("h2");
        if (!headings.length) return;
        var last = headings[headings.length - 1];
        // 末尾评价区块的标题：对局是「综合分析」，其余查询是「点评」
        // （见 templates.ANALYSIS_TITLES）。两个都要认，否则换成「点评」
        // 后这一块拿不到 analysis-heading / analysis-body 这两个类，
        // 底纹与边框全丢，就与本地 Pillow 路径不一致了。
        var heading = (last.textContent || "").trim();
        if (heading !== "综合分析" && heading !== "点评") return;
        last.classList.add("analysis-heading");
        var node = last.nextElementSibling;
        while (node) {
          node.classList.add("analysis-body");
          node = node.nextElementSibling;
        }
      }

      if (window.marked) {
        try {
          el.innerHTML = marked.parse(src);
          paintResultMarks(el);
          buildMatchBanner(el);
          groupPlayerBlocks(el);
          restructurePlayerBlocks(el);
          styleTeamBands(el);
          guardBrokenPortraits(el);
          markAnalysisBlock(el);
        } catch (e) {
          el.textContent = src;
        }
      } else {
        // marked 异常时退化为保留换行的纯文本，避免整张卡片空白或高度塌缩
        el.style.whiteSpace = "pre-wrap";
        el.style.wordBreak = "break-word";
        el.textContent = src;
      }
    })();
  </script>
</body>
</html>
